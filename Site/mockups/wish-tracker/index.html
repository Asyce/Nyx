<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wish Tracker UI Mockups - Nyx</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="mock-shell" id="mockRoot">
    <header class="mock-top">
      <div class="brand-lockup">
        <img src="../../assets/icon/nyx_logo.png" alt="" aria-hidden="true">
        <div>
          <span>Nyx local mockups</span>
          <h1>Wish Tracker</h1>
        </div>
      </div>
      <div class="mock-tags" aria-label="Mockup context">
        <span>Genshin-first</span>
        <span>Real Paimon.moe import</span>
        <span>Local only</span>
      </div>
    </header>

    <nav class="concept-tabs" aria-label="Mockup concepts">
      <button type="button" class="on" data-view-button="ledger">Chase Ledger</button>
      <button type="button" data-view-button="pity">Pity Observatory</button>
      <button type="button" data-view-button="archive">Archive Console</button>
    </nav>

    <main class="mock-main" aria-live="polite">
      <section class="mock-view on" data-view="ledger"></section>
      <section class="mock-view" data-view="pity"></section>
      <section class="mock-view" data-view="archive"></section>
    </main>
  </div>
  <script src="./mockups.js"></script>
</body>
</html>
