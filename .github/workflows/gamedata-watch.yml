name: Nanoka GameData watch & deploy

# Nanoka does not provide this repository with a webhook, so poll its small
# manifest twice daily. The expensive scrape/build path runs only when a supported
# game's manifest section really changed.
#
# Scheduled publishing is handled by daily-deploy.yml. Manual runs retain the
# immediate deploy path when an upstream update must be published urgently.

on:
  schedule:
    - cron: '20 2,14 * * *'
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gamedata:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Checkout no longer smudges LFS (the cache below supplies the objects), so the
      # LFS filters and hooks must be installed here instead. Keep this UNCONDITIONAL:
      # steps that `git add` LFS-tracked paths rely on the clean filter to stage a
      # pointer rather than the full blob, and the pre-push hook is what uploads new
      # LFS objects. Those steps do not all share the LFS pull step's `if:` guard.
      - name: Configure Git LFS
        run: git lfs install --local

      # Only gi/ and hsr/ live rosters are LFS-tracked (~36 MB combined), and they change
      # just a few times a year -- but every run used to re-download both, which is what
      # exhausted the account's 10 GB/month LFS bandwidth. Caching .git/lfs against the
      # pointer files means an object is re-fetched only when it actually changed; the
      # restore-keys prefix also lets a run reuse whichever of the two is still current.
      - name: Cache LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('Database/GameData/gi/live/characters.json', 'Database/GameData/hsr/live/characters.json') }}
          restore-keys: lfs-

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check Nanoka manifest
        id: manifest
        run: node ./Scraper/gamedata/check-upstream.mjs

      - name: Ensure LFS objects resolved
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        run: |
          for i in 1 2 3; do
            git lfs pull && break
            echo "git lfs pull attempt $i failed; retrying" && sleep 5
          done
          for f in Database/GameData/hsr/live/characters.json Database/GameData/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - name: Install scraper deps
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: GameData tests
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Scraper
        run: node --test gamedata/tests/

      - name: Character source tests
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Site
        run: node --test tools/tests/character-source-helpers.test.mjs

      - name: Sync changed GameData (live, beta, and assets)
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Scraper
        env:
          CHANGED_GAMES: ${{ steps.manifest.outputs.games }}
        run: |
          IFS=',' read -ra games <<< "$CHANGED_GAMES"
          for game in "${games[@]}"; do
            node ./gamedata/scrape.mjs --game "$game"
          done

      # This intentionally validates only the changed GameData channels. An
      # unrelated stale banner or Endfield material cannot block a Nanoka update.
      - name: Validate changed GameData
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Scraper
        env:
          CHANGED_GAMES: ${{ steps.manifest.outputs.games }}
        run: node ./gamedata/validate-output.mjs "$CHANGED_GAMES"

      # The R2 asset manifest inventories Git-*tracked* Database assets (git
      # ls-files), while generated site data resolves icons off disk. A freshly
      # synced upstream image is therefore visible to the build but absent from
      # the manifest until it is staged, and in r2-only mode build-deploy aborts
      # with "deploy references an untracked Database image". So commit the
      # synced GameData first and let the preflight build run against a tracked
      # tree, exactly as the sibling data workflows do. Nothing is published
      # here: this commit is local, and the push below is still gated on the
      # preflight build, both smokes, and the exact post-commit repackage.
      - name: Commit synced GameData
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add -A Database/GameData Database/Audits Database/reports
          if git diff --cached --quiet; then
            echo "::error::Nanoka manifest changed but the sync produced no tracked change."
            exit 1
          fi
          git diff --cached --stat
          git commit -m "chore(data): sync Nanoka GameData [skip ci]"

      # Build before publishing the data commit, so broken generated output can
      # never be pushed merely because the upstream manifest changed.
      - name: Preflight site build
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy:generated

      - name: Preflight deploy artifact
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy:generated

      # The GameData itself is already committed above; fold the generated output
      # the verified build produced into that same commit. Generated output may
      # legitimately be identical when an upstream change does not reach the
      # site, so an empty amend is not an error here — "the sync produced no
      # tracked change" is already enforced at commit time.
      - name: Amend verified generated output
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        id: commit
        run: |
          git add -A Database/GameData Database/Audits Database/reports Site/src/data/generated
          if ! git diff --quiet; then
            echo "::error::The GameData build changed an unexpected tracked path."
            git diff --stat
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git diff --cached --stat
            git commit --amend --no-edit
          fi
          git pull --rebase origin main

      # A rebase can bring in newer source/data. Rebuild from that exact base,
      # then amend the generated outputs into the rebased GameData commit.
      - name: Rebuild after rebase
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy:generated

      - name: Smoke rebased deploy artifact
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy:generated

      - name: Amend rebased generated output
        if: ${{ steps.manifest.outputs.changed == 'true' }}
        id: launcher_snapshot
        run: |
          git add -A Database/GameData Database/Audits Database/reports Site/src/data/generated
          if ! git diff --quiet; then
            echo "::error::The rebased GameData build changed an unexpected tracked path."
            git diff --stat
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      # Repackage the already-verified build without regenerating tracked data.
      # This stamps the final amended commit into version.json and cache keys.
      - name: Package exact committed site
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: node ./tools/build-deploy.mjs && node ./tools/inject-seo.mjs

      - name: Smoke exact deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy

      - name: Push verified GameData
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Additively sync Database assets to R2
        id: r2_sync
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'local' && env.CF_API_TOKEN != '' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run sync:database-assets:r2 -- --apply

      # R2 reconciliation can exceed the 15-minute launcher freshness window.
      # Re-commit and rebuild the exact deployment snapshot after that slow step.
      - name: Refresh final deployment launcher snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit final deployment launcher snapshot
        id: deployment_snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh final deployment snapshot [skip ci]"
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build exact final deployment artifact
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.deployment_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy

      - name: Smoke exact final deployment artifact
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy

      - name: Push exact final deployment snapshot
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && steps.deployment_snapshot.outputs.fresh == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
