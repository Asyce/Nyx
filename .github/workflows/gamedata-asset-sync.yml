name: GameData asset sync & deploy

# Daily fill for local GameData image/material assets. The roster workflow keeps
# data fresh with --skip-assets; this job downloads only missing asset files and
# commits those assets separately so normal data commits stay small and readable.

on:
  schedule:
    - cron: '35 7 * * *' # 07:35 UTC daily, after roster + side-data sync
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gamedata-assets:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          lfs: true

      - name: Ensure LFS objects resolved
        run: |
          for i in 1 2 3; do
            git lfs pull && break
            echo "git lfs pull attempt $i failed; retrying" && sleep 5
          done
          for f in Database/GameData/hsr/live/characters.json Database/GameData/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: Scraper
        run: npm test

      - name: Download missing GameData assets
        working-directory: Scraper
        run: node ./gamedata/scrape.mjs --game all

      - name: Stage asset-only changes
        id: assets
        run: |
          git add -A Database/GameData/gi/assets Database/GameData/hsr/assets Database/GameData/ww/assets Database/GameData/zzz/assets
          git ls-files -z -- \
            Database/GameData/manifest.json \
            Database/GameData/changes \
            Database/GameData/_state \
            Database/GameData/gi/live \
            Database/GameData/gi/beta \
            Database/GameData/hsr/live \
            Database/GameData/hsr/beta \
            Database/GameData/ww/live \
            Database/GameData/ww/beta \
            Database/GameData/zzz/live \
            Database/GameData/zzz/beta \
            | xargs -0 -r git restore --worktree --
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No missing GameData assets to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit refreshed assets
        if: ${{ steps.assets.outputs.changed == 'true' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git commit -m "chore(data): scheduled GameData asset sync [skip ci]"
          git pull --rebase origin main

      - name: Refresh committed launcher snapshot
        if: ${{ steps.assets.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        if: ${{ steps.assets.outputs.changed == 'true' }}
        run: |
          git add Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy

      - name: Smoke deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        run: npm run smoke:deploy

      - name: Push verified assets
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Additively sync Database assets to R2
        id: r2_sync
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'local' && env.CF_API_TOKEN != '' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run sync:database-assets:r2 -- --apply

      - name: Deploy to Cloudflare
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
