<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" type="image/png" href="../assets/icon/nyx_logo.png"/>
<title>Pengo • Nyx</title>
<style>
  @font-face{ font-family:'GI';  src:url('../assets/fonts/GI.ttf')  format('truetype'); font-display:swap; }
  @font-face{ font-family:'HSR'; src:url('../assets/fonts/HSR.ttf') format('truetype'); font-display:swap; }

  :root{
    --accent:#8b7bff;
    --accent-bright:#b7aaff;
    --accent-glow:rgba(139,123,255,.6);
    --glow:1;
    --tx:#f3f0ff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#05040b;
    font-family:'HSR','Segoe UI',system-ui,sans-serif;
    color:var(--tx);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  /* ===== full-viewport background stack ===== */
  .page-bg{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:#05030b;
  }
  .page-bg::before{
    content:""; position:absolute; inset:-7vmax; z-index:0; pointer-events:none;
    background:url("../assets/bg/backgroundnyx.png") 50% 48%/118% auto no-repeat;
    filter:brightness(.42) saturate(1.18) hue-rotate(18deg) contrast(1.08);
    transform:scale(1.025);
    opacity:.9;
  }
  .page-bg::after{
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      radial-gradient(ellipse at 50% 112%, rgba(92,70,178,.2) 0%, rgba(58,39,134,.1) 28%, transparent 58%),
      linear-gradient(180deg, rgba(2,2,10,.08) 0%, transparent 42%, rgba(5,3,18,.18) 100%);
    mix-blend-mode:screen;
  }
  .cosmic-bg{ position:absolute; inset:0; z-index:1; width:100%; height:100%; display:block; opacity:.72; }
  @keyframes rot{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  @keyframes chainloop{ from{ offset-distance:0%; } to{ offset-distance:100%; } }

  /* ===== scaling stage ===== */
  .stage-wrap{ position:fixed; inset:0; z-index:3; display:grid; place-items:center; overflow:hidden; }
  .stage{ position:relative; width:1600px; height:900px; transform-origin:center center; }

  /* ===== header — large living-eye logo, hugging the top-right border ===== */
  .hd{ position:absolute; top:-92px; right:-44px; z-index:20; }
  .hd-eye{ position:relative; width:336px; height:336px;
    filter:drop-shadow(0 0 calc(6px*var(--glow)) var(--accent-glow)) drop-shadow(0 3px 12px rgba(0,0,0,.6)); }
  .elayer{ position:absolute; inset:0; background:#f7f4ff;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:100% 100%; mask-size:100% 100%; }
  .elayer.ball{ -webkit-mask-image:url('../assets/icon/eye_ball.png'); mask-image:url('../assets/icon/eye_ball.png');
    transition:transform 1.3s cubic-bezier(.45,.05,.3,1); will-change:transform; }
  .elayer.lid{ -webkit-mask-image:url('../assets/icon/eye_lid.png'); mask-image:url('../assets/icon/eye_lid.png'); }
  .elayer.drips{ -webkit-mask-image:url('../assets/icon/eye_drips.png'); mask-image:url('../assets/icon/eye_drips.png'); }

  /* ===== top-left: large wordmark on the (180-flipped) achievement-cycle plate ===== */
  .hd-right{ position:absolute; top:6px; left:-40px; z-index:20;
    width:720px; height:128px; display:flex; align-items:center; justify-content:flex-start;
    transform:scale(.8); transform-origin:top left; }
  .hd-right .plate{ position:absolute; inset:0; pointer-events:none;
    background:url('../assets/decor/achievement_cycle.png') center/100% 100% no-repeat;
    mix-blend-mode:screen; opacity:.55; transform:rotate(180deg);
    -webkit-mask:linear-gradient(90deg, #000 0%, #000 30%, transparent 88%);
    mask:linear-gradient(90deg, #000 0%, #000 30%, transparent 88%); }
  .hd-right .wm{ position:relative; display:flex; align-items:center; gap:18px; white-space:nowrap;
    font-family:'GI',serif; font-size:78px; line-height:.9; letter-spacing:.04em; color:#f7f4ff;
    text-shadow:0 0 26px var(--accent-glow), 0 2px 18px rgba(0,0,0,.6); }
  .hd-right .wm-logo{ height:120px; width:auto; flex:none;
    filter:drop-shadow(0 0 14px var(--accent-glow)) drop-shadow(0 2px 8px rgba(0,0,0,.55)); }

  /* ===== banner buttons — centered above the cards ===== */
  .topbanners{ display:flex; gap:18px; justify-content:center; }
  :root.hide-banners .topbanners{ display:none; }
  .banner{ position:relative; height:54px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; min-width:248px; padding:0 30px;
    background:url('../assets/cards/principal_frame.png') center/100% 100% no-repeat;
    font-family:'HSR','Segoe UI',sans-serif; font-size:15px; letter-spacing:.16em; text-transform:uppercase;
    color:#ece6ff; text-shadow:0 1px 6px rgba(8,5,26,.9); white-space:nowrap;
    filter:drop-shadow(0 0 calc(4px*var(--glow)) var(--accent-glow)) drop-shadow(0 6px 14px rgba(0,0,0,.5));
    transition:transform .35s cubic-bezier(.2,.7,.2,1), filter .35s; }
  .banner:hover{ transform:translateY(-3px);
    filter:brightness(1.15) drop-shadow(0 0 calc(8px*var(--glow)) var(--accent-glow)) drop-shadow(0 8px 16px rgba(0,0,0,.55)); }
  .banner-seat{ position:absolute; left:-18px; bottom:-10px; height:112px; width:auto; z-index:4;
    pointer-events:none; filter:drop-shadow(0 5px 9px rgba(0,0,0,.55)); }

  /* ===== layout: Nyx apart, games in a 3-wide grid ===== */
  .layout{ position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:46px; }
  .grid{ display:grid; grid-template-columns:repeat(3, 304px); gap:48px 40px; }
  .col{ position:relative; cursor:pointer; transition:filter .5s ease; }
  /* hovering any card greys out all the others */
  .layout:has(.col:hover) .col:not(:hover){ filter:grayscale(1) brightness(.5); }

  /* ===== circular sigil-orbit game card ===== */
  .card{ position:relative; width:304px; height:304px;
    transition:transform .5s cubic-bezier(.2,.7,.2,1), filter .5s;
    filter:drop-shadow(0 0 calc(4px*var(--glow)) var(--accent-glow)) drop-shadow(0 12px 24px rgba(0,0,0,.55)); }
  .framewrap{ position:absolute; inset:0; }
  .bed{ position:absolute; inset:0; border-radius:50%; background:rgba(12,9,34,.6);
    box-shadow:inset 0 0 0 1px rgba(183,170,255,.18); }
  .rail{ position:absolute; border-radius:50%; border:1px solid rgba(183,170,255,.4);
    pointer-events:none; transition:border-color .45s, box-shadow .45s; }
  .rail.out{ inset:0; }
  .rail.in{ inset:18px; }
  .col:hover .rail{ border-color:rgba(207,195,255,.75); box-shadow:0 0 8px rgba(139,123,255,.35); }
  /* the pattern border — a continuous chain of patternv1 sigils riding the
     frame band. Plain purple, no gradient. Paused (fully coloured) at rest;
     orbits only while its card is hovered. */
  .lk{ position:absolute; left:0; top:0; width:36px; height:21px;
    background:var(--accent);
    -webkit-mask:url('../assets/decor/patternv1.png') center/contain no-repeat;
    mask:url('../assets/decor/patternv1.png') center/contain no-repeat;
    offset-path:path('M 152 9 A 143 143 0 0 1 152 295 A 143 143 0 0 1 152 9 Z');
    offset-rotate:auto;
    animation:chainloop 42s linear infinite; animation-play-state:paused;
    animation-delay:calc(var(--i) * -1.75s);
    transition:filter .45s; }
  .col:hover .lk{ animation-play-state:running;
    filter:drop-shadow(0 0 5px rgba(183,170,255,.8)) brightness(1.1); }
  .artwrap{ position:absolute; inset:18px; border-radius:50%; overflow:hidden;
    box-shadow:inset 0 0 0 1.5px rgba(183,170,255,.22), inset 0 0 26px rgba(0,0,0,.55); }
  /* at rest the card shows the game ICON; hovering summons the key art */
  .ico{ position:absolute; inset:0; background-size:cover; background-position:center;
    background-repeat:no-repeat; background-color:#0c0922; }
  .art{ position:absolute; inset:0; background-size:cover; background-position:50% 22%;
    background-repeat:no-repeat; opacity:0;
    transition:opacity .55s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  .col:hover .art{ opacity:1; transform:scale(1.05); }
  /* hover-only background animation over the art — invisible at rest */
  .fx{ position:absolute; inset:0; pointer-events:none;
    background:url('../assets/decor/BgRogueCommonPatternRogue1.png') center/contain no-repeat;
    mix-blend-mode:screen; opacity:0; transition:opacity .5s;
    animation:rot 36s linear infinite reverse; animation-play-state:paused; }
  .col:hover .fx{ opacity:.6; animation-play-state:running; }
  .scrim{ position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(8,6,18,.12) 0%, rgba(8,6,18,0) 26%, rgba(8,6,18,0) 56%, rgba(8,6,18,.62) 100%); }
  /* 8d² portal rings — plain purple, slightly larger than the card and
     BEHIND it; invisible at rest, counter-turning while hovered */
  .ringA, .ringB{ position:absolute; pointer-events:none; opacity:0; z-index:-1;
    background:var(--accent); transition:opacity .5s; }
  .ringA{ inset:-30px;
    -webkit-mask:url('../assets/cards/sumeru_circle_1.png') center/contain no-repeat;
    mask:url('../assets/cards/sumeru_circle_1.png') center/contain no-repeat;
    animation:rot 55s linear infinite reverse; animation-play-state:paused; }
  .ringB{ inset:-14px;
    -webkit-mask:url('../assets/cards/abyss_circle.png') center/contain no-repeat;
    mask:url('../assets/cards/abyss_circle.png') center/contain no-repeat;
    animation:rot 80s linear infinite; animation-play-state:paused; }
  .col:hover .ringA{ opacity:.8; animation-play-state:running; }
  .col:hover .ringB{ opacity:.55; animation-play-state:running; }
  .col:hover .card{ transform:translateY(-8px);
    filter:drop-shadow(0 0 calc(8px*var(--glow)) var(--accent-bright)) drop-shadow(0 12px 26px rgba(0,0,0,.6)); }

  /* Nyx — same circular card as the rest; the living eye sits on
     top of its key art permanently, and its eyeball follows the mouse */
  .simeye{ position:absolute; inset:0; pointer-events:none; z-index:5;
    filter:drop-shadow(0 2px 10px rgba(8,5,26,.7)); }
  .simeye .slayer{ position:absolute; inset:0;
    background:linear-gradient(165deg,#e3dcff,#9a89ea 70%,#7a69d8);
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:50% 44%; mask-position:50% 44%;
    -webkit-mask-size:88% auto; mask-size:88% auto; }
  .simeye .slayer.ball{ -webkit-mask-image:url('../assets/icon/eye_ball.png'); mask-image:url('../assets/icon/eye_ball.png');
    transition:transform .6s cubic-bezier(.2,.7,.2,1); will-change:transform; }
  .simeye .slayer.lid{ -webkit-mask-image:url('../assets/icon/eye_lid.png'); mask-image:url('../assets/icon/eye_lid.png'); }
  .simeye .slayer.drips{ -webkit-mask-image:url('../assets/icon/eye_drips.png'); mask-image:url('../assets/icon/eye_drips.png'); }
  /* hovering the Nyx card: the eyeball vibrates with excitement
     (vibration lives on a wrapper so the gaze-follow transform still applies) */
  .ballvibe{ position:absolute; inset:0; }
  .ballscale{ position:absolute; inset:0; transform-origin:50% 45%;
    transition:transform .5s cubic-bezier(.2,.7,.2,1); }
  .col.sim:hover .ballscale{ transform:scale(1.09); }
  .simeye.sad .ballscale{ transform:scale(.86); transition-duration:1.1s; }
  @keyframes simVibe{ from{ transform:translateX(-1.4px); } to{ transform:translateX(1.4px); } }
  .col.sim:hover .ballvibe{ animation:simVibe .055s linear infinite alternate; }
  :root.no-motion .col.sim:hover .ballvibe{ animation:none; }

  @media (prefers-reduced-motion: reduce){
    .cosmic-bg{ opacity:.9; }
    .lk, .fx, .ringA, .ringB, .elayer.drips, .hd-eye .drop{ animation:none; }
  }

  /* screen-reader / crawler label — the cards stay imagery-only for sighted
     users, but each link carries its game name for assistive tech and search. */
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .col{ text-decoration:none; color:inherit; -webkit-tap-highlight-color:transparent; }
  /* keyboard focus ring around the circular card */
  .col:focus-visible{ outline:3px solid var(--accent-bright); outline-offset:8px; border-radius:50%; }

  /* ===== mobile: a real compact grid instead of the off-screen 1600×900 canvas ===== */
  @media (max-width: 760px){
    html, body{ height:auto; min-height:100%; overflow-x:hidden; overflow-y:auto; }
    .stage-wrap{ position:static; inset:auto; display:block; overflow:visible; height:auto; place-items:initial; }
    .stage{ position:static; width:100%; height:auto; transform:none !important; }
    .hd{ display:none; }
    .hd-right{ position:static; transform:none; width:auto; height:auto;
      padding:24px 16px 2px; justify-content:center; }
    .hd-right .plate{ display:none; }
    .hd-right .wm{ font-size:30px; gap:9px; justify-content:center; }
    .hd-right .wm-logo{ height:38px; }
    .layout{ position:static; inset:auto; padding:10px 16px 40px; gap:20px; justify-content:flex-start; }
    .topbanners{ flex-wrap:wrap; }
    .grid{ grid-template-columns:repeat(2, minmax(0, 1fr)); gap:20px 16px; width:100%; max-width:430px; }
    .col, .col.sim{ width:100%; display:flex; justify-content:center; }
    .card{ width:100%; max-width:170px; height:auto; aspect-ratio:1 / 1; }
    /* hover-only / pixel-anchored decorations don't translate to small touch cards */
    .lk, .ringA, .ringB, .fx{ display:none; }
    .layout:has(.col:active) .col:not(:active){ filter:none; }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#05040b">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#05040b"/>
      <g transform="translate(600 400)">
        <path d="M-150 0 C -80 -70 80 -70 150 0 C 80 70 -80 70 -150 0 Z" fill="none" stroke="#8b7bff" stroke-width="14"/>
        <circle cx="0" cy="0" r="46" fill="#8b7bff"/>
        <circle cx="0" cy="0" r="210" fill="none" stroke="#b7aaff" stroke-width="6" opacity="0.7"/>
      </g>
    </svg>
  </template>
  <div class="page-bg" aria-hidden="true">
    <canvas id="cosmicBg" class="cosmic-bg"></canvas>
  </div>
  <script>
    (function(){
      var canvas = document.getElementById('cosmicBg');
      if (!canvas) return;
      var ctx = canvas.getContext('2d', { alpha:true });
      if (!ctx) return;

      var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches:false };
      var reducedMotion = !!motionQuery.matches;
      var dpr = 1, w = 1, h = 1, raf = 0, resizeRaf = 0;
      var stars = [], glints = [], wisps = [];

      function rng(seed){
        return function(){
          seed |= 0;
          seed = seed + 0x6D2B79F5 | 0;
          var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      function pick(rand, list){ return list[Math.floor(rand() * list.length)]; }
      function wrap(value, min, max){
        var range = max - min;
        return ((((value - min) % range) + range) % range) + min;
      }
      function rgba(c, a){ return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')'; }

      function buildField(){
        var rand = rng(9127 + Math.round(w * 3.1) + Math.round(h * 5.7));
        var starColors = [
          { r:239, g:244, b:255 },
          { r:210, g:222, b:255 },
          { r:184, g:186, b:255 },
          { r:159, g:126, b:255 }
        ];
        var hazeColors = [
          { r:91, g:83, b:210 },
          { r:126, g:80, b:222 },
          { r:61, g:93, b:196 }
        ];
        var area = w * h;
        var starCount = Math.max(190, Math.min(520, Math.round(area / 4100)));
        var glintCount = Math.max(24, Math.min(88, Math.round(area / 24000)));

        stars = [];
        for (var i = 0; i < starCount; i++){
          var depth = .25 + rand() * .95;
          stars.push({
            x: rand() * w,
            y: rand() * h,
            r: (.22 + rand() * 1.25) * depth,
            depth: depth,
            phase: rand() * Math.PI * 2,
            pulse: .55 + rand() * 1.35,
            driftX: (-1.8 + rand() * 3.6) * depth,
            driftY: (.18 + rand() * 1.15) * depth,
            alpha: .24 + rand() * .68,
            color: pick(rand, starColors)
          });
        }

        glints = [];
        for (var j = 0; j < glintCount; j++){
          glints.push({
            x: rand() * w,
            y: rand() * h,
            r: 1.1 + rand() * 3.6,
            speedX: (-.55 + rand() * 1.1),
            speedY: (-.25 + rand() * .5),
            pulse: .35 + rand() * .9,
            phase: rand() * Math.PI * 2,
            alpha: .045 + rand() * .11,
            color: pick(rand, starColors)
          });
        }

        wisps = [];
        for (var k = 0; k < 8; k++){
          wisps.push({
            x: (.08 + rand() * .84) * w,
            y: (.12 + rand() * .86) * h,
            radius: Math.max(w, h) * (.16 + rand() * .24),
            phase: rand() * Math.PI * 2,
            speed: .06 + rand() * .1,
            sway: 8 + rand() * 28,
            alpha: .022 + rand() * .04,
            color: pick(rand, hazeColors)
          });
        }
      }

      function drawNebula(t){
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (var i = 0; i < wisps.length; i++){
          var n = wisps[i];
          var drift = reducedMotion ? 0 : Math.sin(t * n.speed + n.phase) * n.sway;
          var x = n.x + drift;
          var y = n.y + drift * .28;
          var r = n.radius * (reducedMotion ? 1 : 1 + Math.sin(t * n.speed * .7 + n.phase) * .025);
          var grad = ctx.createRadialGradient(x, y, 0, x, y, r);
          grad.addColorStop(0, rgba(n.color, n.alpha));
          grad.addColorStop(.46, rgba(n.color, n.alpha * .45));
          grad.addColorStop(1, rgba(n.color, 0));
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawGlints(t){
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (var i = 0; i < glints.length; i++){
          var p = glints[i];
          var shimmer = reducedMotion ? .72 : .58 + Math.sin(t * p.pulse + p.phase) * .28;
          var x = wrap(p.x + (reducedMotion ? 0 : t * p.speedX), -8, w + 8);
          var y = wrap(p.y + (reducedMotion ? 0 : t * p.speedY), -8, h + 8);
          var r = p.r * shimmer;
          var grad = ctx.createRadialGradient(x, y, 0, x, y, r * 5.2);
          grad.addColorStop(0, rgba(p.color, p.alpha * shimmer));
          grad.addColorStop(.35, rgba(p.color, p.alpha * .36 * shimmer));
          grad.addColorStop(1, rgba(p.color, 0));
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(x, y, r * 5.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStars(t){
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (var i = 0; i < stars.length; i++){
          var s = stars[i];
          var twinkle = reducedMotion ? .86 : .72 + Math.sin(t * s.pulse + s.phase) * .28;
          var alpha = Math.max(.08, s.alpha * twinkle);
          var x = wrap(s.x + (reducedMotion ? 0 : t * s.driftX), -6, w + 6);
          var y = wrap(s.y + (reducedMotion ? 0 : t * s.driftY), -6, h + 6);
          if (s.r > .85){
            var halo = ctx.createRadialGradient(x, y, 0, x, y, s.r * 5.5);
            halo.addColorStop(0, rgba(s.color, alpha * .22));
            halo.addColorStop(1, rgba(s.color, 0));
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(x, y, s.r * 5.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = rgba(s.color, alpha);
          ctx.beginPath();
          ctx.arc(x, y, Math.max(.24, s.r), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function draw(now){
        var t = (now || 0) * .001;
        ctx.clearRect(0, 0, w, h);
        drawNebula(t);
        drawGlints(t);
        drawStars(t);
      }

      function frame(now){
        draw(now);
        if (!reducedMotion && !document.hidden) raf = requestAnimationFrame(frame);
      }

      function start(){
        cancelAnimationFrame(raf);
        raf = 0;
        frame(performance.now());
      }

      function resize(){
        var rect = canvas.getBoundingClientRect();
        w = Math.max(1, Math.round(rect.width || window.innerWidth || 1));
        h = Math.max(1, Math.round(rect.height || window.innerHeight || 1));
        dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildField();
        start();
      }

      window.addEventListener('resize', function(){
        cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(resize);
      });
      document.addEventListener('visibilitychange', function(){
        if (document.hidden) cancelAnimationFrame(raf);
        else start();
      });
      if (motionQuery.addEventListener) {
        motionQuery.addEventListener('change', function(e){
          reducedMotion = !!e.matches;
          start();
        });
      }
      resize();
    })();
  </script>

  <div class="stage-wrap">
    <div class="stage" id="stage">

      <header class="hd">
        <div class="hd-eye" id="hdEye" role="img" aria-label="Pengo • Nyx">
          <div class="elayer ball" id="hdBall"></div>
          <div class="elayer lid"></div>
          <div class="elayer drips"></div>
        </div>
      </header>

      <div class="hd-right">
        <div class="plate"></div>
        <div class="wm"><img class="wm-logo" src="../assets/icon/pengo.png" alt="" draggable="false"/>Pengo • Nyx</div>
      </div>

  <script>
    // scale stage to fit viewport (letterbox)
    (function(){
      var stage = document.getElementById('stage');
      function fit(){
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        if(!vw || !vh){ requestAnimationFrame(fit); return; }
        // mobile uses a natural compact grid (see the max-width:760px CSS), so
        // clear the desktop letterbox transform instead of scaling off-screen.
        if(vw <= 760){ stage.style.transform = ''; return; }
        stage.style.transform = 'scale(' + Math.min(1, vw/1600, vh/900) + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
      fit();
    })();

    // build the 24-link pattern chain on every circular frame — links sized
    // to touch tip-to-tip so they read as one continuous chain
    document.querySelectorAll('.framewrap').forEach(function(fw){
      var anchor = fw.querySelector('.artwrap');
      for(var i = 0; i < 24; i++){
        var lk = document.createElement('div');
        lk.className = 'lk';
        lk.style.setProperty('--i', i);
        fw.insertBefore(lk, anchor);
      }
    });

    // each world card is a real <a> (keyboard + crawlable); this just adds the
    // fade-out transition for plain left-clicks. Modified / middle clicks fall
    // through to native behaviour so "open in new tab" still works.
    (function(){
      var leaving = false;
      document.querySelectorAll('.grid .col').forEach(function(el){
        el.addEventListener('click', function(e){
          if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          var dest = el.getAttribute('href');
          if(!dest || leaving) return;
          e.preventDefault();
          leaving = true;
          document.body.style.transition = 'opacity .32s ease';
          document.body.style.opacity = '0';
          setTimeout(function(){ window.location.href = dest; }, 300);
        });
      });
    })();

    // header eye — slow random wander
    (function(){
      var ball = document.getElementById('hdBall');
      if(!ball) return;
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      (function wander(){
        var a = Math.random() * Math.PI * 2;
        var r = Math.sqrt(Math.random());
        var x = Math.cos(a) * r * 36;   // eyeball travel, px
        var y = Math.sin(a) * r * 15;
        ball.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        setTimeout(wander, 1100 + Math.random() * 1900);
      })();
    })();

    // Nyx eye — follows the mouse; vibrates with excitement when its
    // own card is hovered (CSS); droops sadly when a rival card is hovered
    (function(){
      var eye = document.getElementById('simEye');
      var ball = document.getElementById('simBall');
      if(!eye || !ball) return;
      var mx = null, my = null, raf = null;
      var sad = false, sadTimer = null, droopTimer = null;
      document.addEventListener('mousemove', function(e){
        mx = e.clientX; my = e.clientY;
        if(sad || raf) return;
        raf = requestAnimationFrame(function(){
          raf = null;
          if(sad) return;
          var rc = eye.getBoundingClientRect();
          var cx = rc.left + rc.width / 2;
          var cy = rc.top + rc.height * 0.46;
          var dx = mx - cx, dy = my - cy;
          var d = Math.hypot(dx, dy) || 1;
          var k = Math.min(1, d / 240);
          ball.style.transform = 'translate(' + (dx / d * k * 17).toFixed(1) + 'px,' + (dy / d * k * 8).toFixed(1) + 'px)';
        });
      });
      // hovering a rival card for >0.5s: slowly recenter, then droop downward
      document.querySelectorAll('.col:not(.sim)').forEach(function(col){
        col.addEventListener('mouseenter', function(){
          clearTimeout(sadTimer); clearTimeout(droopTimer);
          sadTimer = setTimeout(function(){
            sad = true;
            eye.classList.add('sad');
            ball.style.transition = 'transform 1.1s cubic-bezier(.4,.1,.3,1)';
            ball.style.transform = 'translate(0px, 0px)';
            droopTimer = setTimeout(function(){
              if(!sad) return;
              ball.style.transition = 'transform 1.9s cubic-bezier(.45,.05,.3,1)';
              ball.style.transform = 'translate(0px, 14px)';
            }, 1150);
          }, 500);
        });
        col.addEventListener('mouseleave', function(){
          clearTimeout(sadTimer); clearTimeout(droopTimer);
          if(sad){ sad = false; eye.classList.remove('sad'); ball.style.transition = ''; }
        });
      });
    })();
  </script>
