        <path d="M-150 0 C -80 -70 80 -70 150 0 C 80 70 -80 70 -150 0 Z" fill="none" stroke="#8b7bff" stroke-width="14"/>
        <circle cx="0" cy="0" r="46" fill="#8b7bff"/>

  <div class="page-bg"></div>
  <script>
    (function(){
      var bg = document.querySelector('.page-bg');
      if (!bg) return;
      function rnd(min, max){ return min + Math.random() * (max - min); }
      var zoom = Math.round(rnd(106, 118));
      var x = Math.round(rnd(28, 72));
      var y = Math.round(rnd(24, 76));
      var flip = Math.random() < .5 ? -1 : 1;
      bg.style.backgroundPosition = x + '% ' + y + '%';
      bg.style.backgroundSize = zoom + '% auto';
      bg.style.transform = 'scaleX(' + flip + ') scale(1.025) rotate(' + rnd(-3.5, 3.5).toFixed(2) + 'deg)';
    })();
  </script>

                    <div class="slayer lid"></div>

                </div>
              </div>
              <span class="ringA"></span><span class="ringB"></span>

            <span class="vis-label" aria-hidden="true">Nyx</span>

              <div class="framewrap">

                <div class="rail in"></div>
                <div class="artwrap">
                  <div class="ico" style="background-image:url('../assets/icon/giicon.png');"></div>

            <span class="sr-only">Honkai: Star Rail</span>

              <div class="framewrap">

                <div class="rail in"></div>
                <div class="artwrap">
                  <div class="ico" style="background-image:url('../assets/icon/hsricon.png');"></div>
                  <div class="art" style="background-image:url('../assets/bg/hsrbg.png'); background-position:50% 8%;"></div>

                  <div class="art" style="background-image:url('../assets/bg/zzzbg3.png'); background-position:55% 35%; background-size:150%;"></div>

                <div class="artwrap">

  <script>
    // scale stage to fit viewport (letterbox)
    (function(){
      var stage = document.getElementById('stage');
      function fit(){
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        if(!vw || !vh){ requestAnimationFrame(fit); return; }
        // mobile uses a natural compact grid (see the max-width:760px CSS), so
        // clear the desktop letterbox transform instead of scaling off-screen.
        if(vw <= 760){ stage.style.transform = ''; return; }
        stage.style.transform = 'scale(' + Math.min(1, vw/1600, vh/900) + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
      fit();
    })();

    // build the 24-link pattern chain on every circular frame — links sized
    // to touch tip-to-tip so they read as one continuous chain
    document.querySelectorAll('.framewrap').forEach(function(fw){
      var anchor = fw.querySelector('.artwrap');
      for(var i = 0; i < 24; i++){
        var lk = document.createElement('div');
        lk.className = 'lk';
        lk.style.setProperty('--i', i);
        fw.insertBefore(lk, anchor);
      }
    });

    // each world card is a real <a> (keyboard + crawlable); this just adds the
    // fade-out transition for plain left-clicks. Modified / middle clicks fall
    // through to native behaviour so "open in new tab" still works.
    (function(){
      var leaving = false;
      document.querySelectorAll('.grid .col').forEach(function(el){
        el.addEventListener('click', function(e){
          if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          var dest = el.getAttribute('href');
          if(!dest || leaving) return;
          e.preventDefault();
          leaving = true;
          document.body.style.transition = 'opacity .32s ease';
          document.body.style.opacity = '0';
          setTimeout(function(){ window.location.href = dest; }, 300);
        });
      });
    })();

    // header eye — slow random wander
    (function(){
      var ball = document.getElementById('hdBall');
      if(!ball) return;
      if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      (function wander(){
        var a = Math.random() * Math.PI * 2;
        var r = Math.sqrt(Math.random());
        var x = Math.cos(a) * r * 36;   // eyeball travel, px
        var y = Math.sin(a) * r * 15;
        ball.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        setTimeout(wander, 1100 + Math.random() * 1900);
      })();
    })();

    // Nyx eye — follows the mouse; vibrates with excitement when its
    // own card is hovered (CSS); droops sadly when a rival card is hovered
    (function(){
      var eye = document.getElementById('simEye');
      var ball = document.getElementById('simBall');
      if(!eye || !ball) return;
      var mx = null, my = null, raf = null;
      var sad = false, sadTimer = null, droopTimer = null;
      document.addEventListener('mousemove', function(e){
        mx = e.clientX; my = e.clientY;
        if(sad || raf) return;
        raf = requestAnimationFrame(function(){
          raf = null;
          if(sad) return;
          var rc = eye.getBoundingClientRect();
          var cx = rc.left + rc.width / 2;
          var cy = rc.top + rc.height * 0.46;
          var dx = mx - cx, dy = my - cy;
          var d = Math.hypot(dx, dy) || 1;
          var k = Math.min(1, d / 240);
          ball.style.transform = 'translate(' + (dx / d * k * 17).toFixed(1) + 'px,' + (dy / d * k * 8).toFixed(1) + 'px)';
        });
      });
      // hovering a rival card for >0.5s: slowly recenter, then droop downward
      document.querySelectorAll('.col:not(.sim)').forEach(function(col){
        col.addEventListener('mouseenter', function(){
          clearTimeout(sadTimer); clearTimeout(droopTimer);
          sadTimer = setTimeout(function(){
            sad = true;
            eye.classList.add('sad');
            ball.style.transition = 'transform 1.1s cubic-bezier(.4,.1,.3,1)';
            ball.style.transform = 'translate(0px, 0px)';
            droopTimer = setTimeout(function(){
              if(!sad) return;
              ball.style.transition = 'transform 1.9s cubic-bezier(.45,.05,.3,1)';
              ball.style.transform = 'translate(0px, 14px)';
            }, 1150);
          }, 500);
        });
        col.addEventListener('mouseleave', function(){
          clearTimeout(sadTimer); clearTimeout(droopTimer);
          if(sad){ sad = false; eye.classList.remove('sad'); ball.style.transition = ''; }
        });
      });
    })();
  </script>

</body>
</html>
