name: Data refresh & deploy

# Daily refresh of fast-moving banners, codes, and events. Scheduled publishing
# is handled by daily-deploy.yml; manual runs retain the immediate deploy path.

on:
  schedule:
    - cron: '15 3 * * *' # 03:15 UTC daily
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Checkout no longer smudges LFS (the cache below supplies the objects), so the
      # LFS filters and hooks must be installed here instead. Keep this UNCONDITIONAL:
      # steps that `git add` LFS-tracked paths rely on the clean filter to stage a
      # pointer rather than the full blob, and the pre-push hook is what uploads new
      # LFS objects. Those steps do not all share the LFS pull step's `if:` guard.
      - name: Configure Git LFS
        run: git lfs install --local

      # Only gi/ and hsr/ live rosters are LFS-tracked (~36 MB combined), and they change
      # just a few times a year -- but every run used to re-download both, which is what
      # exhausted the account's 10 GB/month LFS bandwidth. Caching .git/lfs against the
      # pointer files means an object is re-fetched only when it actually changed; the
      # restore-keys prefix also lets a run reuse whichever of the two is still current.
      - name: Cache LFS objects
        id: lfs_cache
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('Database/GameData/gi/live/characters.json', 'Database/GameData/hsr/live/characters.json') }}
          restore-keys: lfs-

      # actions/checkout's LFS smudge intermittently leaves pointer files behind
      # (a transient GitHub LFS hiccup). That makes the site build crash later on
      # JSON.parse of a "version https://git-lfs..." pointer, half-deploying. Re-pull
      # and verify the LFS-tracked rosters up front so a flaky checkout fails fast
      # here (preserving the live last-known-good) instead of mid-build.
      - name: Ensure LFS objects resolved
        run: |
          # Resolve from the objects we already have before asking the server.
          # With a warm cache this makes no network call at all, so an exhausted
          # LFS budget can no longer break a run that needs nothing new.
          git lfs checkout || true
          if git grep -Il '^version https://git-lfs.github.com/spec/v1' -- Database >/dev/null; then
            for i in 1 2 3; do
              git lfs pull && break
              echo "git lfs pull attempt $i failed; retrying" && sleep 5
            done
          fi
          for f in Database/GameData/hsr/live/characters.json Database/GameData/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm ci --no-audit --no-fund

      # Pure-function tests (reward filter + banner timeline/freshness). A failure
      # here stops the job before anything is committed or deployed.
      - name: Unit tests
        working-directory: Scraper
        run: npm test

      # Retry short source/CDN failures before failing closed. Each attempt keeps
      # last-known-good data, while --require-fresh requires every required game
      # to succeed from a current-run source. Exit 2 is an expected source outage
      # and retries; exit 1 is an unexpected scraper failure and stays red.
      - name: Scrape banners + codes
        id: banner_refresh
        working-directory: Scraper
        run: |
          banner_ready=false
          for attempt in 1 2 3; do
            set +e
            node ./banners/scrape.cjs --require-fresh
            banner_status=$?
            set -e
            if [ "$banner_status" -eq 0 ]; then
              banner_ready=true
              break
            fi
            if [ "$banner_status" -ne 2 ]; then
              echo "::error::banner attempt $attempt failed unexpectedly (exit $banner_status)"
              exit "$banner_status"
            fi
            echo "::warning::banner attempt $attempt had a required source outage or stale timeline"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$banner_ready" != true ]; then
            echo "::warning::required banner sources stayed unavailable after 3 attempts; carrying forward banners while events continue"
            git restore --source=HEAD -- ../Database/Banners/banners.json ../Database/reports/banner-teaser-art-provenance.json
            git clean -fd -- ../Site/assets/banners
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          node ./codes/scrape.cjs   || echo "::warning::codes scrape had errors; carry-forward applied"

      # Official in-game event announcements (GI/HSR/ZZZ/WuWa/Endfield). The pipeline
      # self-preserves last-known-good per game on a failed/empty fetch, so a source
      # outage (or a geo/CDN-gated endpoint from the runner) must not fail the job.
      # This is also where WuWa's aki-game.net and the sg- HoYo hosts get probed live
      # from the Actions runner (they may behave differently than a local machine).
      - name: Scrape in-game events
        working-directory: Scraper
        run: node ./events/index.mjs || echo "::warning::events scrape had errors; carry-forward applied"

      # Structural gate on the REAL scraped output. Non-zero here = refuse to
      # commit/deploy, so the already-live last-known-good is preserved.
      - name: Validate scraped data
        working-directory: Scraper
        run: |
          if [ "${{ steps.banner_refresh.outputs.fresh }}" = "true" ]; then
            npm run validate:strict
          else
            npm run validate
          fi

      - name: Commit refreshed data
        id: data_commit
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          if [ "${{ steps.banner_refresh.outputs.fresh }}" = "true" ]; then
            git add Database
            git add -A Site/assets/banners Site/assets/events
          else
            git add Database/Events Database/Activities Database/reports/event-art-provenance.json
            git add -A Site/assets/events
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore(data): scheduled banner/code refresh [skip ci]"
            git pull --rebase origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh committed site and launcher feeds
        if: ${{ steps.data_commit.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Refresh and verify official launcher backgrounds
        id: launcher_visuals
        working-directory: Site
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          npm run generate:launcher-visuals
          npm run verify:launcher-visuals:source
          if [ -n "$(git status --porcelain -- src/data/generated/launcher-visuals src/data/generated/launcher-visuals-v1.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A background-only update still needs a newly timestamped launcher feed;
      # otherwise the normal build correctly rejects the old 15-minute snapshot.
      - name: Refresh launcher feeds for a background-only snapshot
        if: ${{ steps.data_commit.outputs.changed != 'true' && steps.launcher_visuals.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        if: ${{ steps.data_commit.outputs.changed == 'true' || steps.launcher_visuals.outputs.changed == 'true' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json Site/src/data/generated/launcher-tools-v1.json
          git add -A Site/src/data/generated/launcher-art Site/src/data/generated/launcher-visuals Site/src/data/generated/launcher-visuals-v1.json
          if ! git diff --cached --quiet; then
            if [ "${{ steps.data_commit.outputs.changed }}" = "true" ]; then
              git commit --amend --no-edit
            else
              git commit -m "chore(data): refresh launcher backgrounds [skip ci]"
            fi
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy

      - name: Smoke deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy

      - name: Push verified data
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      # Content-addressed assets go first; the verified mutable manifest goes last.
      - name: Publish launcher backgrounds to Pengo R2
        if: ${{ env.CF_API_TOKEN != '' }}
        working-directory: Site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run sync:launcher-visuals:r2 -- --apply

      - name: Additively sync Database assets to R2
        id: r2_sync
        if: ${{ github.event_name == 'workflow_dispatch' && steps.banner_refresh.outputs.fresh == 'true' && steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'local' && env.CF_API_TOKEN != '' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run sync:database-assets:r2 -- --apply

      # R2 reconciliation can exceed the 15-minute launcher freshness window.
      # Re-commit and rebuild the exact deployment snapshot after that slow step.
      - name: Refresh final deployment launcher snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit final deployment launcher snapshot
        id: deployment_snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json Site/src/data/generated/launcher-tools-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh final deployment snapshot [skip ci]"
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build exact final deployment artifact
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.deployment_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy

      - name: Smoke exact final deployment artifact
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy

      - name: Push exact final deployment snapshot
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'workflow_dispatch' && steps.banner_refresh.outputs.fresh == 'true' && steps.launcher_snapshot.outputs.fresh == 'true' && steps.deployment_snapshot.outputs.fresh == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ./node_modules/wrangler/bin/wrangler.js deploy
