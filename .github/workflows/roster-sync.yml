name: Roster sync & deploy

# Daily refresh of the slower-moving data: character rosters, materials, weapon
# metadata, character subtitles. Runs the scrapers with --skip-assets so CI never
# downloads/commits large image dirs (new characters fall back to the source CDN
# icon, which the site already supports). Run an asset sync manually when needed.

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daily
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  roster:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # Database/GameData/*/live/characters.json are LFS-tracked

      # actions/checkout's LFS smudge intermittently leaves pointer files behind
      # (a transient GitHub LFS hiccup). That makes the site build crash later on
      # JSON.parse of a "version https://git-lfs..." pointer, half-deploying. Re-pull
      # and verify the LFS-tracked rosters up front so a flaky checkout fails fast
      # here (preserving the live last-known-good) instead of mid-build.
      - name: Ensure LFS objects resolved
        run: |
          for i in 1 2 3; do
            git lfs pull && break
            echo "git lfs pull attempt $i failed; retrying" && sleep 5
          done
          for f in Database/GameData/hsr/live/characters.json Database/GameData/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: Scraper
        run: npm test

      # Nanoka GameData has its own 15-minute manifest watcher, which owns both
      # its JSON and assets. This daily job keeps the slower secondary sources.
      # Each scraper preserves prior data on a failed fetch; warn but don't fail.
      - name: Sync rosters / materials (data only, no assets)
        working-directory: Scraper
        run: |
          node ./prydwen/scrape.mjs                          || echo "::warning::prydwen sync had errors; carry-forward applied"
          node ./gachabase-beta/scrape.mjs                   || echo "::warning::gachabase beta sync had errors; carry-forward applied"
          node ./endfield-wiki/scrape.mjs                    || echo "::warning::endfield-wiki sync had errors; carry-forward applied"
          node ./wiki-titles/scrape.mjs                      || echo "::warning::wiki-titles sync had errors; carry-forward applied"
          node ./banners/scrape.cjs                          || echo "::warning::banner scrape had errors; carry-forward applied"
          node ./codes/scrape.cjs                            || echo "::warning::codes scrape had errors; carry-forward applied"
          npm --prefix ../Site run scrape:gcg                 || echo "::warning::genshin tcg scrape had errors; carry-forward applied"

      - name: Validate scraped data
        working-directory: Scraper
        run: npm run validate

      - name: Commit refreshed data
        id: roster_commit
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Database
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore(data): scheduled roster/material sync [skip ci]"
            git pull --rebase origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh committed site and launcher feeds
        if: ${{ steps.roster_commit.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        if: ${{ steps.roster_commit.outputs.changed == 'true' }}
        run: |
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        run: npm run build:deploy

      - name: Smoke deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        run: npm run smoke:deploy

      - name: Push verified data
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Deploy to Cloudflare
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
