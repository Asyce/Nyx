name: Data refresh & deploy

# High-frequency refresh of the fast-moving data (banners + redemption codes).
# Runs every 6 hours so newly-added codes/banners reach pengo.gg quickly.
# Heavy roster/material/asset syncs live in roster-sync.yml (daily).

on:
  schedule:
    - cron: '15 */6 * * *' # 00:15, 06:15, 12:15, 18:15 UTC
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          lfs: true # Database/GameData/*/live/characters.json are LFS-tracked

      # actions/checkout's LFS smudge intermittently leaves pointer files behind
      # (a transient GitHub LFS hiccup). That makes the site build crash later on
      # JSON.parse of a "version https://git-lfs..." pointer, half-deploying. Re-pull
      # and verify the LFS-tracked rosters up front so a flaky checkout fails fast
      # here (preserving the live last-known-good) instead of mid-build.
      - name: Ensure LFS objects resolved
        run: |
          for i in 1 2 3; do
            git lfs pull && break
            echo "git lfs pull attempt $i failed; retrying" && sleep 5
          done
          for f in Database/GameData/hsr/live/characters.json Database/GameData/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm ci --no-audit --no-fund

      # Pure-function tests (reward filter + banner timeline/freshness). A failure
      # here stops the job before anything is committed or deployed.
      - name: Unit tests
        working-directory: Scraper
        run: npm test

      # Retry short source/CDN failures before failing closed. Each attempt keeps
      # last-known-good data, while --require-fresh requires every required game
      # to succeed from a current-run source. Exit 2 is an expected source outage
      # and retries; exit 1 is an unexpected scraper failure and stays red.
      - name: Scrape banners + codes
        id: banner_refresh
        working-directory: Scraper
        run: |
          banner_ready=false
          for attempt in 1 2 3; do
            set +e
            node ./banners/scrape.cjs --require-fresh
            banner_status=$?
            set -e
            if [ "$banner_status" -eq 0 ]; then
              banner_ready=true
              break
            fi
            if [ "$banner_status" -ne 2 ]; then
              echo "::error::banner attempt $attempt failed unexpectedly (exit $banner_status)"
              exit "$banner_status"
            fi
            echo "::warning::banner attempt $attempt had a required source outage or stale timeline"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$banner_ready" != true ]; then
            echo "::warning::required banner sources stayed unavailable after 3 attempts; skipping validation, commit, build, and deploy"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          node ./codes/scrape.cjs   || echo "::warning::codes scrape had errors; carry-forward applied"

      # Official in-game event announcements (GI/HSR/ZZZ/WuWa/Endfield). The pipeline
      # self-preserves last-known-good per game on a failed/empty fetch, so a source
      # outage (or a geo/CDN-gated endpoint from the runner) must not fail the job.
      # This is also where WuWa's aki-game.net and the sg- HoYo hosts get probed live
      # from the Actions runner (they may behave differently than a local machine).
      - name: Scrape in-game events
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' }}
        working-directory: Scraper
        run: node ./events/index.mjs || echo "::warning::events scrape had errors; carry-forward applied"

      # Structural gate on the REAL scraped output. Non-zero here = refuse to
      # commit/deploy, so the already-live last-known-good is preserved.
      - name: Validate scraped data
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' }}
        working-directory: Scraper
        run: npm run validate:strict

      - name: Commit refreshed data
        id: data_commit
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Database
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            git commit -m "chore(data): scheduled banner/code refresh [skip ci]"
            git pull --rebase origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh committed site and launcher feeds
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' && steps.data_commit.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' && steps.data_commit.outputs.changed == 'true' }}
        run: |
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' && steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
        run: npm run build:deploy

      - name: Smoke deploy artifact
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' && steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        run: npm run smoke:deploy

      - name: Push verified data
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' && steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Deploy to Cloudflare
        if: ${{ steps.banner_refresh.outputs.fresh == 'true' && steps.launcher_snapshot.outputs.fresh == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
