name: Banner history refresh & deploy

# Isolated from current banners and redemption codes: a wiki/API shape change
# must fail only this history refresh and preserve the live last-known-good files.
on:
  schedule:
    - cron: '45 4 * * 1,4' # 04:45 UTC Monday and Thursday
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  banner-history:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Checkout no longer smudges LFS (the cache below supplies the objects), so the
      # LFS filters and hooks must be installed here instead. Keep this UNCONDITIONAL:
      # steps that `git add` LFS-tracked paths rely on the clean filter to stage a
      # pointer rather than the full blob, and the pre-push hook is what uploads new
      # LFS objects. Those steps do not all share the LFS pull step's `if:` guard.
      - name: Configure Git LFS
        run: git lfs install --local

      # Only gi/ and hsr/ live rosters are LFS-tracked (~36 MB combined), and they change
      # just a few times a year -- but every run used to re-download both, which is what
      # exhausted the account's 10 GB/month LFS bandwidth. Caching .git/lfs against the
      # pointer files means an object is re-fetched only when it actually changed; the
      # restore-keys prefix also lets a run reuse whichever of the two is still current.
      - name: Cache LFS objects
        id: lfs_cache
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('Database/GameData/gi/live/characters.json', 'Database/GameData/hsr/live/characters.json') }}
          restore-keys: lfs-

      - name: Resolve LFS data
        run: |
          # Resolve from the objects we already have before asking the server.
          # With a warm cache this makes no network call at all, so an exhausted
          # LFS budget can no longer break a run that needs nothing new.
          git lfs checkout || true
          if git grep -Il '^version https://git-lfs.github.com/spec/v1' -- Database >/dev/null; then
            for i in 1 2 3; do
              git lfs pull && break
              echo "git lfs pull attempt $i failed; retrying" && sleep 5
            done
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site dependencies
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: Banner history unit tests
        working-directory: Scraper
        run: npm run banners:history:test

      - name: Refresh all five histories atomically
        working-directory: Scraper
        run: npm run banners:history

      - name: Validate last-known-good candidate
        working-directory: Scraper
        run: npm run validate

      - name: Commit semantic history candidate
        id: history_commit
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Database/BannerHistory Database/Activities Site/src/features/gacha/pulls-banners-gi.js Site/src/features/gacha/pulls-banners-ae.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No semantic banner-history changes."
          else
            git commit -m "chore(data): scheduled banner-history refresh [skip ci]"
            git pull --rebase origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh committed site and launcher feeds
        if: ${{ steps.history_commit.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        if: ${{ steps.history_commit.outputs.changed == 'true' }}
        run: |
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json Site/src/data/generated/launcher-tools-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy

      - name: Smoke published history and activities
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy

      - name: Push verified history
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Additively sync Database assets to R2
        id: r2_sync
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'local' && env.CF_API_TOKEN != '' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run sync:database-assets:r2 -- --apply

      # R2 reconciliation can exceed the 15-minute launcher freshness window.
      # Re-commit and rebuild the exact deployment snapshot after that slow step.
      - name: Refresh final deployment launcher snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit final deployment launcher snapshot
        id: deployment_snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && (env.DATABASE_ASSET_MODE == 'local' || steps.r2_sync.outputs.ready == 'true') && env.CF_API_TOKEN != '' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json Site/src/data/generated/launcher-tools-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh final deployment snapshot [skip ci]"
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build exact final deployment artifact
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.deployment_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run build:deploy

      - name: Smoke exact final deployment artifact
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
        run: npm run smoke:deploy

      - name: Push exact final deployment snapshot
        if: ${{ steps.deployment_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Deploy to Cloudflare
        if: ${{ github.event_name == 'workflow_dispatch' && steps.launcher_snapshot.outputs.fresh == 'true' && steps.deployment_snapshot.outputs.fresh == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
