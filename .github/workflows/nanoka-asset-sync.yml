name: Nanoka asset sync & deploy

# Daily fill for local Nanoka image/material assets. The roster workflow keeps
# data fresh with --skip-assets; this job downloads only missing asset files and
# commits those assets separately so normal data commits stay small and readable.

on:
  schedule:
    - cron: '35 7 * * *' # 07:35 UTC daily, after roster + side-data sync
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nanoka-assets:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS objects resolved
        run: |
          for i in 1 2 3; do
            git lfs pull && break
            echo "git lfs pull attempt $i failed; retrying" && sleep 5
          done
          for f in Database/Nanoka/hsr/live/characters.json Database/Nanoka/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: Scraper
        run: npm test

      - name: Download missing Nanoka assets
        working-directory: Scraper
        run: node ./nanoka/scrape.mjs --game all

      - name: Stage asset-only changes
        id: assets
        run: |
          git add -A Database/Nanoka/gi/assets Database/Nanoka/hsr/assets Database/Nanoka/ww/assets Database/Nanoka/zzz/assets
          git ls-files -z -- \
            Database/Nanoka/manifest.json \
            Database/Nanoka/changes \
            Database/Nanoka/_state \
            Database/Nanoka/gi/live \
            Database/Nanoka/gi/beta \
            Database/Nanoka/hsr/live \
            Database/Nanoka/hsr/beta \
            Database/Nanoka/ww/live \
            Database/Nanoka/ww/beta \
            Database/Nanoka/zzz/live \
            Database/Nanoka/zzz/beta \
            | xargs -0 -r git restore --worktree --
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No missing Nanoka assets to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit refreshed assets
        if: ${{ steps.assets.outputs.changed == 'true' }}
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git commit -m "chore(data): scheduled Nanoka asset sync [skip ci]"
          git pull --rebase origin main
          git push

      - name: Build site
        if: ${{ steps.assets.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run build:deploy

      - name: Smoke deploy artifact
        if: ${{ steps.assets.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run smoke:deploy

      - name: Deploy to Cloudflare
        if: ${{ steps.assets.outputs.changed == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
