name: Side data sync & deploy

# Daily refresh for the smaller secondary datasets that the site uses around the
# main rosters: birthdays, namecards, signatures, TCG, furniture, Wonderland, The Library, holidays,
# and Endfield skill icons. Banner history has its own isolated six-hour workflow.

on:
  schedule:
    - cron: '45 6 * * *' # 06:45 UTC daily, after roster-sync
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  side-data:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NYX_USE_CRAWL4AI: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          lfs: true

      - name: Ensure LFS objects resolved
        run: |
          for i in 1 2 3; do
            git lfs pull && break
            echo "git lfs pull attempt $i failed; retrying" && sleep 5
          done
          for f in Database/GameData/hsr/live/characters.json Database/GameData/gi/live/characters.json; do
            if head -c 40 "$f" | grep -q 'git-lfs'; then
              echo "::error::$f is still an LFS pointer after git lfs pull"; exit 1
            fi
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Crawl4AI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "crawl4ai>=0.9,<1"
          crawl4ai-setup || python -m playwright install chromium

      - name: Install scraper deps
        working-directory: Scraper
        run: npm ci --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: Scraper
        run: npm test

      - name: Sync side datasets
        working-directory: Site
        run: npm run scrape:side-data

      - name: Validate scraped data
        working-directory: Scraper
        run: npm run validate

      - name: Commit refreshed side data
        id: side_commit
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Database
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No side-data changes to commit."
          else
            git commit -m "chore(data): scheduled side-data sync [skip ci]"
            git pull --rebase origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh committed launcher snapshot
        if: ${{ steps.side_commit.outputs.changed == 'true' }}
        working-directory: Site
        run: npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        if: ${{ steps.side_commit.outputs.changed == 'true' }}
        run: |
          git add Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build site
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
        run: npm run build:deploy

      - name: Smoke deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        working-directory: Site
        run: npm run smoke:deploy

      - name: Push verified data
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Deploy to Cloudflare
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy
