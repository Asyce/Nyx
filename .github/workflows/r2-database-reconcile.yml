name: Stage and cut over Database assets to R2

# Serialized staged rollout: full additive read-back, dual deploy/live checks,
# then an optional R2-only cutover with automatic dual rollback.
on:
  workflow_dispatch:
    inputs:
      cutover_to_r2_only:
        description: "After dual passes live checks, deploy R2-only. Set the repository mode manually only after this run succeeds."
        required: true
        default: false
        type: boolean

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      DATABASE_ASSET_MODE: ${{ vars.DATABASE_ASSET_MODE || 'local' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          lfs: true

      - name: Ensure LFS objects resolved
        run: |
          git lfs pull
          if git grep -Il '^version https://git-lfs.github.com/spec/v1' -- Database; then
            echo "::error::Database still contains an unresolved LFS pointer"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install site dependencies
        working-directory: Site
        run: npm ci --no-audit --no-fund

      - name: Refresh committed launcher snapshot
        working-directory: Site
        run: npm run generate:data && npm run refresh:launcher

      - name: Commit refreshed launcher snapshot
        id: launcher_snapshot
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Site/src/data/generated/nyx-data.js Site/src/data/generated/launcher-codes-v1.json Site/src/data/generated/launcher-banners-v1.json
          git add -A Site/src/data/generated/launcher-art
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh launcher snapshot for R2 reconcile [skip ci]"
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test migration controls
        working-directory: Site
        run: npm run test:database-assets

      - name: Build exact dual deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'r2-only' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: dual
        run: npm run build:deploy

      - name: Smoke exact dual deploy artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'r2-only' }}
        working-directory: Site
        run: npm run smoke:deploy

      - name: Build exact current R2-only artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE == 'r2-only' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: r2-only
        run: npm run build:deploy

      - name: Smoke exact current R2-only artifact
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE == 'r2-only' }}
        working-directory: Site
        env:
          PENGO_DATABASE_ASSET_MODE: r2-only
        run: npm run smoke:deploy

      - name: Push verified launcher snapshot
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' }}
        run: git push

      - name: Additively reconcile Database assets and manifests
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run sync:database-assets:r2 -- --apply --verify-all

      - name: Deploy to Cloudflare exact dual artifact
        id: deploy_dual
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && env.DATABASE_ASSET_MODE != 'r2-only' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy

      - name: Live-check dual rollout
        id: verify_dual
        if: ${{ env.DATABASE_ASSET_MODE != 'r2-only' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_LIVE_CHECK_CONCURRENCY: "24"
        run: node ./tools/live-check-database-assets.mjs --full

      # A successful recovery does not erase the earlier failed step: the job
      # remains red, preserving the original rollout failure signal.
      - name: Restore exact local artifact after an unsuccessful dual rollout
        id: restore_local
        if: ${{ failure() && env.DATABASE_ASSET_MODE != 'r2-only' && (steps.deploy_dual.outcome == 'failure' || (steps.deploy_dual.outcome == 'success' && steps.verify_dual.outcome != 'success')) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: local
        run: |
          cd Site
          npm run build:deploy
          npm run smoke:deploy
          cd ..
          npx --yes wrangler deploy

      - name: Build and smoke exact R2-only artifact
        if: ${{ inputs.cutover_to_r2_only || env.DATABASE_ASSET_MODE == 'r2-only' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: r2-only
        run: npm run build:deploy && npm run smoke:deploy

      - name: Deploy exact R2-only artifact
        id: deploy_r2
        if: ${{ steps.launcher_snapshot.outputs.fresh == 'true' && (inputs.cutover_to_r2_only || env.DATABASE_ASSET_MODE == 'r2-only') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy

      - name: Live-check R2-only rollout
        id: verify_r2
        if: ${{ inputs.cutover_to_r2_only || env.DATABASE_ASSET_MODE == 'r2-only' }}
        working-directory: Site
        env:
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
        run: node ./tools/live-check-database-assets.mjs --full

      - name: Restore verified dual artifact after a failed cutover
        id: restore_dual
        if: ${{ failure() && env.DATABASE_ASSET_MODE != 'r2-only' && (steps.deploy_r2.outcome == 'failure' || (steps.deploy_r2.outcome == 'success' && steps.verify_r2.outcome != 'success')) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PENGO_DEPLOY_COMMIT: ${{ steps.launcher_snapshot.outputs.sha }}
          PENGO_DATABASE_ASSET_MODE: dual
        run: |
          cd Site
          npm run build:deploy
          npm run smoke:deploy
          cd ..
          npx --yes wrangler deploy

      - name: Roll back the prior R2-only deployment after a failed live check
        id: rollback_r2
        if: ${{ failure() && env.DATABASE_ASSET_MODE == 'r2-only' && steps.deploy_r2.outcome == 'success' && steps.verify_r2.outcome != 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler rollback --message "Automatic rollback after failed R2-only live check"
