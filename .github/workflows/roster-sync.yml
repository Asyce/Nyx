name: Roster sync & deploy

# Daily refresh of the slower-moving data: character rosters, materials, weapon
# metadata, character subtitles. Runs the scrapers with --skip-assets so CI never
# downloads/commits large image dirs (new characters fall back to the source CDN
# icon, which the site already supports). Run an asset sync manually when needed.

on:
  schedule:
    - cron: '30 5 * * *' # 05:30 UTC daily
  workflow_dispatch: {}

concurrency:
  group: pengo-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  roster:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper deps
        working-directory: Scraper
        run: npm install --no-audit --no-fund

      - name: Install site deps
        working-directory: Site
        run: npm install --no-audit --no-fund

      - name: Unit tests
        working-directory: Scraper
        run: npm test

      # Each scraper preserves prior data on a failed fetch; warn but don't fail.
      - name: Sync rosters / materials (data only, no assets)
        working-directory: Scraper
        run: |
          node ./nanoka/scrape.mjs --game all --skip-assets || echo "::warning::nanoka sync had errors; carry-forward applied"
          node ./prydwen/scrape.mjs                          || echo "::warning::prydwen sync had errors; carry-forward applied"
          node ./endfield-wiki/scrape.mjs                    || echo "::warning::endfield-wiki sync had errors; carry-forward applied"
          node ./wiki-titles/scrape.mjs                      || echo "::warning::wiki-titles sync had errors; carry-forward applied"
          node ./banners/scrape.cjs                          || echo "::warning::banner scrape had errors; carry-forward applied"
          node ./codes/scrape.cjs                            || echo "::warning::codes scrape had errors; carry-forward applied"

      - name: Validate scraped data
        working-directory: Scraper
        run: npm run validate

      - name: Build site
        working-directory: Site
        run: npm run build:deploy

      - name: Deploy to Cloudflare
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler deploy

      - name: Commit refreshed data
        run: |
          git config user.name "pengo-bot"
          git config user.email "bot@pengo.gg"
          git add Database
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): scheduled roster/material sync [skip ci]"
            git push
          fi
