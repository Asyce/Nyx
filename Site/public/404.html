<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta http-equiv="refresh" content="10;url=https://pengo.gg/"/>
<link rel="icon" type="image/png" href="/assets/icon/pengoemote-right.png"/>
<title>Pengo</title>
<style>
  @font-face{ font-family:'GI'; src:url('/assets/fonts/GI.ttf') format('truetype'); font-display:swap; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:#05040b; color:#f3f0ff; font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;
    background-image:radial-gradient(120% 95% at 50% 22%, #0b0820 0%, #05040b 72%); }
  h1{ font-family:'GI',serif; font-size:clamp(36px,8vw,64px); letter-spacing:.06em; margin-bottom:18px;
    text-shadow:0 0 26px rgba(139,123,255,.45); }
  .message{ display:grid; gap:8px; max-width:720px; }
  p{ color:#c9c0ec; font-size:16px; line-height:1.5; }
</style>
</head>
<body>
  <h1 id="code">404</h1>
  <div class="message">
    <p>Pengo returned to the Void.. Nyx will summon another in <span id="countdown">10 seconds</span></p>
    <p id="sorry" hidden>I'm sorry little one..</p>
    <p id="fate" hidden><em>Ducunt volentem fata, nolentem trahunt</em></p>
    <p id="farewell" hidden>Good luck, Pengo..</p>
  </div>
  <script>
    const end = Date.now() + 10000;
    const countdown = document.getElementById('countdown');
    const sorry = document.getElementById('sorry');
    const fate = document.getElementById('fate');
    const farewell = document.getElementById('farewell');
    const code = document.getElementById('code');
    const number = new Intl.NumberFormat('nl-BE').format(Math.floor(Math.random() * 33550336) + 1);

    const update = () => {
      const seconds = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      countdown.textContent = `${seconds} second${seconds === 1 ? '' : 's'}`;
      sorry.hidden = seconds > 8;
      fate.hidden = seconds > 6;
      farewell.hidden = seconds > 4;
      if (seconds <= 2) code.textContent = number;
      if (seconds === 0) window.location.replace('https://pengo.gg/');
    };

    update();
    setInterval(update, 100);
  </script>
</body>
</html>
