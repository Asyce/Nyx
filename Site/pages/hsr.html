<script>
  // Fluid stage: height-fit scaling; stage width grows with aspect ratio
  // (1600 design units at 16:9 up to 2150 at ultrawide), anchored to the top
  // so the header band always sits flush with the window top. Windows text
  // scaling / browser zoom shrink the CSS viewport â€” this absorbs both.
  (function(){
    var stage = document.getElementById('stage');
    function fit(){
      var vw = window.innerWidth || document.documentElement.clientWidth;
      var vh = window.innerHeight || document.documentElement.clientHeight;
      if(!vw || !vh){ requestAnimationFrame(fit); return; }
      if (vw <= 760) {
        stage.classList.add('is-compact-stage');
        document.documentElement.classList.add('nyx-compact-layout');
        stage.style.width = vw + 'px';
        stage.style.height = vh + 'px';
        stage.style.transform = 'none';
        return;
      }
      stage.classList.remove('is-compact-stage');
      document.documentElement.classList.remove('nyx-compact-layout');
      var aspect = vw / vh;
      var sw = Math.max(1600, Math.min(2150, Math.round(900 * aspect)));
      var scale = Math.min(vw / sw, vh / 900);
      if(!isFinite(scale) || scale <= 0) scale = 1;
      stage.style.width = sw + 'px';
      stage.style.height = '900px';
      stage.style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
